[project]
name = "vice"
version = "0.1.0"
description = "Voice-first background AI assistant"
requires-python = ">=3.12"
dependencies = [
    "kokoro-onnx>=0.6.1",
    "numpy>=2.0",
    "sounddevice>=0.5",
]

[project.scripts]
vice = "vice.__main__:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
